name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q -o sr-browser-v8.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - name: Copy APK
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk SR-Browser-v1.8.apk
      - name: Save APK in Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SR-Browser-v1.8
          path: SR-Browser-v1.8.apk
      - name: Publish APK in Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.8-build-${{ github.run_number }}-${{ github.run_attempt }}" SR-Browser-v1.8.apk --title "S.R Browser v1.8 (build ${{ github.run_number }})" --notes "UC style settings, night animation, brightness, homepage colours"
